<!doctype html>
<html><head><meta charset="utf-8">
<!-- Isolated HEIC→JPEG converter. Loaded in a sandboxed iframe (opaque origin: no access to the app's data or storage).
     heic2any needs eval (Emscripten), so eval is allowed HERE ONLY – the main app keeps a strict CSP without 'unsafe-eval'. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src blob:; img-src blob: data:; connect-src blob: data:">
</head><body>
<script src="/heic/heic2any.min.js"></script>
<script src="/heic/bridge.js"></script>
</body></html>
